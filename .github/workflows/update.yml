name: update-data

# 数据自动更新：由 GitHub 的机器跑 python update_data.py，把 data.json / index.html / history.json
# 提交回仓库，Pages 随即重建 —— 不需要本机开机。
on:
  schedule:
    # cron 用 UTC，北京时间 = UTC+8（本机 TZ 由下面的 env 强制成 Asia/Shanghai）
    # 只在开市日跑，9:00 起每 30 分钟一次到 15:30（午休 11:35-12:55 无交易，不跑）
    # 上午：09:00 / 09:30 / 10:00 / 10:30 / 11:00 / 11:30  ⇒ UTC 1:00-3:30
    - cron: '0,30 1-3 * * 1-5'
    # 下午：13:00 / 13:30 / 14:00 / 14:30 / 15:00 / 15:30  ⇒ UTC 5:00-7:30
    - cron: '0,30 5-7 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '休市日也运行，并在数据无变化时强制提交（仅用于手动补推）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai     # 必须：elapsed_frac()/date.today() 都读本机时区，runner 默认 UTC 会把盘中等比算错
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests

      - name: 交易日闸（非开市日直接跳过）
        id: gate
        run: |
          v=$(python trading_day.py)
          echo "run=$v" >> "$GITHUB_OUTPUT"
          echo "gate → run=$v"

      - name: 取数并评分
        if: steps.gate.outputs.run == '1' || inputs.force == true
        run: |
          python update_data.py || {
            echo "第一次失败（多为数据源瞬时限流），60 秒后重试一次"
            sleep 60
            python update_data.py
          }

      - name: 数据完整性守卫（不合格就不许覆盖线上）
        if: steps.gate.outputs.run == '1' || inputs.force == true
        run: |
          python - <<'PY'
          import json, sys, datetime
          d = json.load(open('data.json', encoding='utf-8'))
          lb, sc = d.get('leaderboard') or [], d.get('scores') or []
          problems = []
          if len(lb) < 5:   problems.append('leaderboard 只有 %d 条' % len(lb))
          if len(sc) < 50:  problems.append('scores 只有 %d 条' % len(sc))
          if not d.get('updated_at'): problems.append('缺 updated_at')
          if problems:
              print('拒绝提交：' + '；'.join(problems))
              print('多半是数据源在本 runner 上不可达或限流，线上保持原样。')
              sys.exit(1)
          print('OK leaderboard=%d scores=%d updated_at=%s' % (len(lb), len(sc), d['updated_at']))
          PY

      - name: 提交并推送
        if: steps.gate.outputs.run == '1' || inputs.force == true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json index.html history.json
          if git diff --cached --quiet; then
            if [ "${{ inputs.force }}" = "true" ]; then
              git commit --allow-empty -m "data: $(date '+%Y-%m-%d %H:%M') 强制刷新"
              git push
            else
              echo "数据无变化，跳过提交"
            fi
          else
            git commit -m "data: $(date '+%Y-%m-%d %H:%M') 自动更新"
            git push
          fi
