<style>
:root{
  --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 14px;max-width:1100px;margin:0 auto}
h1{font-size:22px;text-align:center;margin-bottom:4px;letter-spacing:2px}
.meta{text-align:center;color:var(--dim);font-size:12px;margin-bottom:18px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;margin-right:4px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
h2{font-size:16px;margin:20px 0 10px;color:var(--blue);border-left:4px solid var(--blue);padding-left:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;text-align:left;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap}
th{background:#1c2330;color:var(--dim);font-weight:600;font-size:12px}
th[data-sort]{cursor:pointer;-webkit-user-select:none;user-select:none}
th[data-sort]:hover{color:var(--text)}
th[data-sort].sorted{color:var(--gold)}
th .sar{font-size:9px;margin-left:3px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2330}
.num{font-variant-numeric:tabular-nums;font-family:Menlo,Consolas,monospace}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)}
.score{font-size:17px;font-weight:700;color:var(--gold)}
.cpt{font-size:11px;color:var(--blue)}
.lead{color:var(--gold);font-weight:700}
.follow{color:var(--dim)}
  /* 个股名链接：深底不出现 UA 默认蓝/紫，颜色继承所在单元格 */
  a.sk,a.sk:link,a.sk:visited{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(139,148,158,.55)}
  a.sk:hover{color:var(--blue);border-bottom-color:var(--blue)}
.loading{text-align:center;color:var(--dim);padding:40px 0}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table.wide{min-width:760px;table-layout:auto}
td .wrap-cell{white-space:normal;max-width:160px;display:inline-block}
.empty{text-align:center;color:var(--dim);padding:28px 10px;font-size:13px;line-height:1.8}
.r1 td{background:rgba(212,160,23,.10)}
.tk{color:var(--up);font-weight:700}
@media(max-width:760px){th,td{padding:6px 8px;font-size:12px}.score{font-size:15px}}
</style>
</head>

// ---------- 个股链接（口径：E:\AI 长期记忆 2026-10-27「归因页股票代码/名称已加链接」）----------
// 代码 → https://stockpage.10jqka.com.cn/{6位}      名称 → https://xuangutong.com.cn/stock/{6位}.{SUF}
// 交易所后缀：选股通用 Yahoo 风格 —— 沪市 .SS、深市 .SZ、北交所 .BJ。
// 不能直接透传数据自带后缀：数据源是通达信风格(.SH)，选股通规范写法是 .SS（.SH 也能打开，但不是它自己的写法）。
// 前缀规则：920/4/8→BJ 先判，6/9→SS，其余 SZ。
function _suf(code){
  const c=String(code||"").replace(/\D/g,"").padStart(6,"0"), h=c.charAt(0);
  if(c.slice(0,3)==="920"||h==="4"||h==="8") return "BJ";
  if(h==="6"||h==="9") return "SS";
  return "SZ";
}
function skName(name,code){
  if(!name) return "";
  const raw=String(code||"").split(".")[0];
  if(!raw) return name;                                   // 拿不到代码就保持纯文本，不编链接
  const c=raw.padStart(6,"0");                             // 必须 6 位补零，短码会被同花顺解析成港股 F10
  return '<a class="sk" target="_blank" rel="noopener" href="https://xuangutong.com.cn/stock/'+c+'.'+_suf(code)+'">'+name+'</a>';
}
function buildNameMap(d){
  const m={};
  const put=arr=>{(arr||[]).forEach(s=>{ if(s&&s.name&&s.code) m[s.name]=s.code; });};
  put(d.scores); put(d.leaderboard); put(d.fallback);
  Object.keys(d.lists_raw||{}).forEach(k=>put(d.lists_raw[k]));
  Object.keys(d.lists||{}).forEach(k=>put(d.lists[k]));
  window.NAME2CODE=m;
}
function skByName(name){ return skName(name,(window.NAME2CODE||{})[name]); }

// ---------- 表头点击排序 ----------
// 三态：默认顺序 → 降序 ▼ → 升序 ▲ → 回到默认。排序只在已渲染的这批数据上做，不重新抓数。
const SORTS={lb:{key:null,dir:0,src:[],dimmed:false},bs:{key:null,dir:0,src:[]},cpt:{key:null,dir:0,src:[]}};
const UP_FIRST={name:1,concept:1,cpt:1,leader:1,rank:1};   // 这几列首次点击按升序(排名数字小=靠前)，其余降序
function cmpVal(a,b,dir){
  const ea=(a==null||a===''), eb=(b==null||b==='');
  if(ea&&eb) return 0;
  if(ea) return 1;            // 缺值永远沉底，不随升降序翻转
  if(eb) return -1;
  if(typeof a==='string'||typeof b==='string'){
    return dir*String(a).localeCompare(String(b),'zh-Hans-CN');
  }
  return dir*(Number(a)-Number(b));
}
function sortBy(arr,f,dir){
  if(!f||!dir) return arr.slice();
  return arr.slice().sort((x,y)=>cmpVal(f(x),f(y),dir));
}
function cycleSort(st,k){
  const first=UP_FIRST[k]?1:-1;
  if(st.key!==k){st.key=k;st.dir=first;}
  else if(st.dir===first){st.dir=-first;}
  else {st.key=null;st.dir=0;}
}
function paintArrows(tid,st){
  const ths=document.querySelectorAll('#'+tid+' th[data-sort]');
  for(let i=0;i<ths.length;i++){
    const th=ths[i], on=(th.getAttribute('data-sort')===st.key&&st.dir!==0);
    if(on) th.classList.add('sorted'); else th.classList.remove('sorted');
    const sp=th.querySelector('.sar');
    if(sp) sp.textContent=on?(st.dir<0?'▼':'▲'):'';
  }
}
function ddSpan(v){ return v==null?'<span class="dim">--</span>':(v>0?`<span class="up">+${v}</span>`:(v<0?`<span class="down">${v}</span>`:'0')); }

const CPTF={cpt:r=>(r.heat||r.attn).concept,
  hn:r=>r.heat?r.heat.n:null, hprev:r=>r.heat?(r.heat.prev_n??null):null, hdelta:r=>r.heat?(r.heat.delta??null):null,
  an:r=>r.attn?r.attn.n:null, aprev:r=>r.attn?(r.attn.prev_n??null):null, adelta:r=>r.attn?(r.attn.delta??null):null,
  sw:r=>r.heat?(r.heat.strong??null):null, net:r=>r.heat?(r.heat.net??null):null, lu:r=>r.heat?(r.heat.limit_up??0):null,
  mom:r=>r.heat?(r.heat.mom??null):null, ci:r=>r.heat?(r.heat.ci??null):null,
  leader:r=>((r.heat?r.heat.leader:r.attn.leader)||null)};

function renderConcepts(el,heat,attn,traj){
  const attnMap={}; (attn||[]).forEach(g=>attnMap[g.concept]=g);
  const src=[];
  (heat||[]).forEach(g=>src.push({heat:g,attn:attnMap[g.concept]||null}));
  (attn||[]).forEach(a=>{ if(!(heat||[]).some(g=>g.concept===a.concept)) src.push({heat:null,attn:a}); });
  SORTS.cpt.src=src;
  paintCPT();
}
function cptRow(r){
  const g=r.heat, a=r.attn;
  if(!g){
    return `<tr><td><b>${a.concept}</b></td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td>
      <td class="num">${a.n}</td><td class="num dim">${a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${ddSpan(a.delta)}</td>
      <td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="lead">${skByName(a.leader)}</td></tr>`;
  }
  const arr=(g.traj||[]).map(t=>t.net>0?'<span class="up">↑</span>':(t.net<0?'<span class="down">↓</span>':'<span class="dim">→</span>')).join('')||'<span class="dim">今日建档</span>';
  const net=g.net>0?`<span class="up">+${g.net}</span>`:(g.net<0?`<span class="down">${g.net}</span>`:'0');
  const tk=g.takeover?'<span class="tk">🔥接棒候选</span> ':'';
  return `<tr><td><b>${g.concept}</b>${tk}</td>
    <td class="num">${g.n}</td><td class="num dim">${g.prev_n??'--'}</td><td class="num">${ddSpan(g.delta)}</td>
    <td class="num">${a?a.n:'--'}</td><td class="num dim">${a&&a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${a?ddSpan(a.delta):'--'}</td>
    <td class="num"><span class="up">${g.strong}</span>/<span class="down">${g.weak}</span></td>
    <td class="num">${net}</td><td class="num">${g.limit_up??0}${g.lu_delta?'<span class="'+(g.lu_delta>0?'up':'down')+'">('+(g.lu_delta>0?'+':'')+g.lu_delta+')</span>':''}</td><td class="num ${g.mom>=0?'up':'down'}">${g.mom??'--'}</td><td class="num">${g.ci??'--'}</td><td>${arr}</td><td class="lead">${skByName(g.leader)}</td></tr>`;
}
function paintCPT(){
  const st=SORTS.cpt, el=document.getElementById('cpt_rows'); if(!el) return;
  const arr=sortBy(st.src,CPTF[st.key],st.dir);
  el.innerHTML=arr.length?arr.map(x=>cptRow(x)).join(''):'<tr><td colspan="14" class="dim">暂无集群概念</td></tr>';
  paintArrows('cpt_tbl',st);
}
function sortCPT(k){ cycleSort(SORTS.cpt,k); paintCPT(); }

}
function paintLB(){
  const st=SORTS.lb, el=document.getElementById('lb_rows'); if(!el) return;
  if(!st.src.length){
    el.innerHTML='<tr><td colspan="9" class="empty">今日暂无正分标的：全市场热度较5日均值回落。收盘后自动重算。</td></tr>';
    paintArrows('lb_tbl',st); return;
  }
  const arr=sortBy(st.src,LBF[st.key],st.dir);
  let html=st.dimmed?'<tr><td colspan="9" class="empty" style="padding:10px">今日暂无正分标的（全市场热度较5日均值回落）。<br>以下为<b>相对分参考榜</b>，按热度回落最小排序，仅供观察：</td></tr>':'';
  for(let i=0;i<arr.length;i++) html+=lbRow(arr[i],st.dimmed,i,!st.dimmed&&i===0);
  el.innerHTML=html;
  paintArrows('lb_tbl',st);
}
function sortLB(k){ cycleSort(SORTS.lb,k); paintLB(); }

function doSearch(){
  const q=(document.getElementById("q").value||"").trim();
  const el=document.getElementById("sr");
  if(!q){el.innerHTML="";return}
  const hit=(window.DATA&&DATA.scores||[]).find(s=>s.name===q||s.name.indexOf(q)>=0||q.indexOf(s.name)>=0);
  if(!hit){el.innerHTML='<div class="empty" style="border:1px solid var(--border);border-radius:10px;margin-bottom:14px">未找到「'+q+'」的评分记录（仅覆盖热度/关注度前100股票池，接口恢复后自动扩充）</div>';return}
  const r=(v,fix)=>v==null?'--':(fix!=null?Number(v).toFixed(fix):v);
  const rows=[
    ['人气排名(全市场)','第'+r(hit.heat_rank)+'名'],
    ['热度增长',r(hit.heat_growth)+'%'],
    ['跨日 / 日内加速',r(hit.g_cross)+'% / '+(hit.g_accel==null?'--':r(hit.g_accel)+'%')],
    ['连板','<span class="cpt">'+(hit.board_tag||'--')+'</span>'],
    ['动量分 M',r(hit.M,3)],
    ['水平分 L',r(hit.L,3)],
    ['概念','<span class="cpt">'+(hit.concept||'游离主线')+'</span>'+(hit.is_leader?' <b class="lead">龙头</b>':(hit.concept_pos?' 概念内第'+hit.concept_pos+'位':''))],
    ['概念系数',r(hit.concept_factor,3)],
    ['换手启动','<span class="cpt">'+(hit.launch||'--')+'</span>'+(hit.swap_down?' <span class="down">⚠️向下换手</span>':'')],
    ['换手因子',r(hit.t_factor,3)],
    ['价格因子',r(hit.pf,3)],
    ['位置(60日)',hit.pos60==null?'--':(hit.pos60*100).toFixed(0)+'%'],
    ['涨停','<span class="up">今日涨停</span>'],
  ].filter(x=>x[0]!=='涨停'||hit.limit_up);
  el.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">'
   +'<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px"><b style="font-size:17px">'+skName(hit.name,hit.code)+'</b>'
   +'<span style="color:var(--dim)">¥'+r(hit.price,2)+'</span>'
   +'<span class="score" style="font-size:20px">'+r(hit.score_final,1)+'分</span>'
   +(hit.score_final?'':'<span style="color:var(--dim);font-size:12px">无正分 · 相对分 '+r(hit.rel_score,1)+'</span>')
   +'</div><table style="border:none"><tbody>'
   +rows.map(x=>'<tr><td style="border:none;color:var(--dim);width:150px">'+x[0]+'</td><td style="border:none" class="num">'+x[1]+'</td></tr>').join('')
   +'</tbody></table></div>';
}

// ===== 板块强度榜 =====
const BSF={name:b=>b.name||null, inc:b=>(b.inc??null), strength:b=>(b.strength??null), net:b=>(b.main_net??null)};
function renderBS(el,bs){
  SORTS.bs.src=(bs||[]).slice();
  paintBS();
}
function paintBS(){
  const st=SORTS.bs, el=document.getElementById('bs_rows'); if(!el) return;
  if(!st.src.length){ el.innerHTML='<tr><td colspan="4" class="dim">--</td></tr>'; paintArrows('bs_tbl',st); return; }
  const arr=sortBy(st.src,BSF[st.key],st.dir);
  el.innerHTML=arr.map(b=>`<tr><td><b>${b.name}</b></td>
    <td class="num ${b.inc>=0?'up':'down'}">${b.inc>=0?'+':''}${(b.inc||0).toFixed(2)}%</td>
    <td class="num">${(b.strength||0).toFixed(0)}</td>
    <td class="num ${b.main_net>=0?'up':'down'}">${((b.main_net||0)/1e8).toFixed(2)}亿</td></tr>`).join('');
  paintArrows('bs_tbl',st);
}
function sortBS(k){ cycleSort(SORTS.bs,k); paintBS(); }

function render(d){
  if((!d.scores||!d.scores.length)&&!(d.leaderboard&&d.leaderboard.length)&&!(d.fallback&&d.fallback.length)){
    console.log("忽略空数据(接口额度恢复前保留快照)");return;
  }
  buildNameMap(d);
  window.DATA=d;
  document.getElementById("upd").textContent=d.updated_at+(d.intraday?"（盘中）":"（收盘）");
  renderLB(document.getElementById("lb_rows"),d.leaderboard,d.fallback);
  renderConcepts(document.getElementById("cpt_rows"),d.concept_stats_heat||[],d.concept_stats||[]);
  renderBS(document.getElementById("bs_rows"),d.board_strength);
}
render(EMBEDDED);
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{render(d)}).catch(()=>{});
setInterval(()=>{fetch("data.json?t="+Date.now()).then(r=>r.json()).then(render).catch(()=>{})},60000);
</script>
</body>
