function _suf(code){
  const c=String(code||"").replace(/\D/g,"").padStart(6,"0"), h=c.charAt(0);

  return "SZ";
}
function skName(name,code){

  const ea=(a==null||a===''), eb=(b==null||b==='');

    if(sp) sp.textContent=on?(st.dir<0?'▼':'▲'):'';
  }
}
function ddSpan(v){ return v==null?'<span class="dim">--</span>':(v>0?`<span class="up">+${v}</span>`:(v<0?`<span class="down">${v}</span>`:'0')); }

// ===== 概念总榜 =====
const CPTF={cpt:r=>(r.heat||r.attn).concept,
  hn:r=>r.heat?r.heat.n:null, hprev:r=>r.heat?(r.heat.prev_n??null):null, hdelta:r=>r.heat?(r.heat.delta??null):null,
  an:r=>r.attn?r.attn.n:null, aprev:r=>r.attn?(r.attn.prev_n??null):null, adelta:r=>r.attn?(r.attn.delta??null):null,
  sw:r=>r.heat?(r.heat.strong??null):null, net:r=>r.heat?(r.heat.net??null):null, lu:r=>r.heat?(r.heat.limit_up??0):null,
  mom:r=>r.heat?(r.heat.mom??null):null, hchg:r=>r.heat?(r.heat.hchg??null):null, ci:r=>r.heat?(r.heat.ci??null):null,
  leader:r=>((r.heat?r.heat.leader:r.attn.leader)||null)};

function renderConcepts(el,heat,attn,traj){
  const attnMap={}; (attn||[]).forEach(g=>attnMap[g.concept]=g);
  const src=[];
  (heat||[]).forEach(g=>src.push({heat:g,attn:attnMap[g.concept]||null}));
  (attn||[]).forEach(a=>{ if(!(heat||[]).some(g=>g.concept===a.concept)) src.push({heat:null,attn:a}); });
  SORTS.cpt.src=src;
  paintCPT();
}
function cptRow(r){
  const g=r.heat, a=r.attn;
  if(!g){
    return `<tr><td><b>${a.concept}</b></td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td>
      <td class="num">${a.n}</td><td class="num dim">${a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${ddSpan(a.delta)}</td>
      <td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="lead">${skByName(a.leader)}</td></tr>`;
  }
  const arr=(g.traj||[]).map(t=>t.net>0?'<span class="up">↑</span>':(t.net<0?'<span class="down">↓</span>':'<span class="dim">→</span>')).join('')||'<span class="dim">今日建档</span>';
  const net=g.net>0?`<span class="up">+${g.net}</span>`:(g.net<0?`<span class="down">${g.net}</span>`:'0');
  const tk=g.takeover?'<span class="tk">🔥接棒候选</span> ':'';
  return `<tr><td><b>${g.concept}</b>${tk}</td>
    <td class="num">${g.n}</td><td class="num dim">${g.prev_n??'--'}</td><td class="num">${ddSpan(g.delta)}</td>
    <td class="num">${a?a.n:'--'}</td><td class="num dim">${a&&a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${a?ddSpan(a.delta):'--'}</td>
    <td class="num"><span class="up">${g.strong}</span>/<span class="down">${g.weak}</span></td>
    <td class="num">${net}</td><td class="num">${g.limit_up??0}${g.lu_delta?'<span class="'+(g.lu_delta>0?'up':'down')+'">('+(g.lu_delta>0?'+':'')+g.lu_delta+')</span>':''}</td><td class="num ${g.mom>=0?'up':'down'}">${g.mom??'--'}</td><td class="num ${g.hchg!=null?(g.hchg>=0?'up':'down'):''}">${g.hchg==null?'<span class="dim">累积中</span>':(g.hchg>=0?'+':'')+g.hchg+'%'}</td><td class="num">${g.ci??'--'}</td><td>${arr}</td><td class="lead">${skByName(g.leader)}</td></tr>`;
}
function paintCPT(){
  const st=SORTS.cpt, el=document.getElementById('cpt_rows'); if(!el) return;
  const arr=sortBy(st.src,CPTF[st.key],st.dir);
  el.innerHTML=arr.length?arr.map(x=>cptRow(x)).join(''):'<tr><td colspan="15" class="dim">暂无集群概念</td></tr>';
  paintArrows('cpt_tbl',st);
}
function sortCPT(k){ cycleSort(SORTS.cpt,k); paintCPT(); }

// ===== 评分榜 =====
function thsUrl(s){
  const code=(s.code||''), mkt=code.endsWith('.SH')?'17':'33';
  return 'https://ms.10jqka.com.cn/thsHotDetail/?name='+encodeURIComponent(s.name||'')+'&code='+code.slice(0,6)+'&marketCode='+mkt;
}
const LBF={name:s=>s.name||null, score:s=>(s.score_final??s.composite??null), rank:s=>(s.heat_rank??null),
  growth:s=>(s.heat_growth??null), concept:s=>(s.concept||null), board:s=>(s.boards||null),
  turn:s=>(s.turnover_ratio??null), price:s=>(s.price??null)};

function lbRow(s,dimmed,i,first){
  const concept=(s.concept?`<a class="cpt" style="text-decoration:none" href="${thsUrl(s)}" target="_blank" rel="noopener" title="点击打开同花顺热股解析：异动解读/炒作逻辑">${s.concept_all||s.concept}</a>`
    +(s.concept_pos?` <span class="${s.is_leader?'lead':'follow'}">${s.is_leader?'龙头':'概念内第'+s.concept_pos+'位'}</span>`:'')
    +(s.benefit_lv?` <span title="概念利多强度: 由异动解读逻辑正文的硬动作信号(中标/签订/试制完成/取得注册证…)判定, 纯远景描述(尚处拓展/占比极小)为弱" style="font-size:10px;padding:0 4px;border-radius:8px;background:${s.benefit_lv==='强'?'rgba(230,57,70,.15);color:var(--up)':s.benefit_lv==='弱'?'rgba(120,120,120,.15);color:var(--dim)':'rgba(240,173,78,.18);color:#b8860b'}">利多${s.benefit_lv}</span>`:'')
    :'<span class="dim">--</span>');
  const turn=(s.turnover_ratio==null?'<span class="dim">--</span>':`<span class="num ${s.turnover_ratio>=0?'up':'down'}">${s.turnover_ratio>=0?'+':''}${s.turnover_ratio}%</span>`)
    +(s.swap_down?'<br><span class="down">⚠️向下换手</span>':'')
    +(s.launch?`<br><span class="cpt">🚀${s.launch}</span>`:'');
  const board=s.boards?`<span class="up">${s.board_tag||(s.boards+'板')}</span>`:'<span class="dim">--</span>';
  return `<tr${first?' class="r1"':''}${dimmed?' style="opacity:.55"':''}><td class="dim num">${i+1}</td>
     <td><b>${skName(s.name,s.code)}</b></td>
     <td class="dim num">${s.price!=null?"¥"+s.price.toFixed(2):'--'}</td>
     <td class="score num"${dimmed?' style="color:var(--dim)"':''}>${s.score_final??s.composite??'--'}</td>
     <td class="num">${s.heat_rank?(s.ths_heat!=null?`<b>${wan(s.ths_heat)}</b><span class="dim" style="font-size:10px">·${s.ths_heat_src=='day'?'日':'时'}</span><br><span class="dim" style="font-size:10px">第${s.heat_rank}名</span>`:('第'+s.heat_rank+'名')):'--'}</td>
     <td>${pct(s.heat_growth)}</td>
     <td>${concept}</td><td>${board}</td><td>${turn}</td></tr>`;
}

function renderLB(el,L,fb){
  const st=SORTS.lb, hasL=!!(L&&L.length);
  st.src=hasL?L.slice():((fb&&fb.length)?fb.slice():[]);
  st.dimmed=!hasL&&!!(fb&&fb.length);
  paintLB();
}
function paintLB(){
  const st=SORTS.lb, el=document.getElementById('lb_rows'); if(!el) return;
  if(!st.src.length){
    el.innerHTML='<tr><td colspan="9" class="empty">今日暂无正分标的：全市场热度较5日均值回落。收盘后自动重算。</td></tr>';
    paintArrows('lb_tbl',st); return;
  }
  const arr=sortBy(st.src,LBF[st.key],st.dir);
  let html=st.dimmed?'<tr><td colspan="9" class="empty" style="padding:10px">今日暂无正分标的（全市场热度较5日均值回落）。<br>以下为<b>相对分参考榜</b>，按热度回落最小排序，仅供观察：</td></tr>':'';
  for(let i=0;i<arr.length;i++) html+=lbRow(arr[i],st.dimmed,i,!st.dimmed&&i===0);
  el.innerHTML=html;
  paintArrows('lb_tbl',st);
}
function sortLB(k){ cycleSort(SORTS.lb,k); paintLB(); }

function doSearch(){
  const q=(document.getElementById("q").value||"").trim();
  const el=document.getElementById("sr");
  if(!q){el.innerHTML="";return}
  const hit=(window.DATA&&DATA.scores||[]).find(s=>s.name===q||s.name.indexOf(q)>=0||q.indexOf(s.name)>=0);
  if(!hit){el.innerHTML='<div class="empty" style="border:1px solid var(--border);border-radius:10px;margin-bottom:14px">未找到「'+q+'」的评分记录（仅覆盖热度/关注度前100股票池，接口恢复后自动扩充）</div>';return}
  const r=(v,fix)=>v==null?'--':(fix!=null?Number(v).toFixed(fix):v);
  const rows=[
    ['人气排名(全市场)','第'+r(hit.heat_rank)+'名'],
    ['热度值(同花顺)',hit.ths_heat==null?'--':wan(hit.ths_heat)+'（'+(hit.ths_heat_src=='day'?'当日累计':'近1小时')+'）'],
    ['热度变化10日',hit.heat_chg10==null?'累积中(历史样本攒够后给出)':(hit.heat_chg10>=0?'<span class="up">升温 +'+hit.heat_chg10+'%</span>':'<span class="down">降温 '+hit.heat_chg10+'%</span>')+'（换手10日比 '+(hit.turn10_ratio==null?'--':(hit.turn10_ratio>=0?'+':'')+hit.turn10_ratio+'%')+' 等）'],
    ['热度增长',r(hit.heat_growth)+'%'],
    ['跨日 / 日内加速',r(hit.g_cross)+'% / '+(hit.g_accel==null?'--':r(hit.g_accel)+'%')],
    ['连板','<span class="cpt">'+(hit.board_tag||'--')+'</span>'],
    ['动量分 M',r(hit.M,3)],
    ['水平分 L',r(hit.L,3)],
    ['概念',(hit.concept?'<a class="cpt" style="text-decoration:none" href="'+thsUrl(hit)+'" target="_blank" rel="noopener" title="点击打开同花顺热股解析：异动解读/炒作逻辑">'+(hit.concept_all||hit.concept)+'</a>':'<span class="dim">游离主线</span>')+(hit.is_leader?' <b class="lead">龙头</b>':(hit.concept_pos?' 概念内第'+hit.concept_pos+'位':''))+(hit.benefit_lv?' <span style="font-size:10px;color:'+(hit.benefit_lv==='强'?'var(--up)':hit.benefit_lv==='弱'?'var(--dim)':'#b8860b')+'">利多'+hit.benefit_lv+'</span>':'')],
    ['概念系数',r(hit.concept_factor,3)],
    ['可操作性',hit.op_factor==null?'--':(hit.op_factor<0.9?'<span class="down">追高位(今日涨幅大,明日高开空间小) ×'+hit.op_factor+'</span>':hit.op_factor>1?'<span class="up">低吸位(涨幅<2%,空间足) ×'+hit.op_factor+'</span>':'中性 ×'+hit.op_factor)],
    ['大咖观点(30日)',hit.vp30==null?'--':(hit.vp30+' 条'+(hit.vp_up||hit.vp_down?' <span class="up">多'+hit.vp_up+'</span>/<span class="down">空'+hit.vp_down+'</span>':'')+' · 因子 ×'+(hit.vp_factor||1))],
    ['换手启动','<span class="cpt">'+(hit.launch||'--')+'</span>'+(hit.swap_down?' <span class="down">⚠️向下换手</span>':'')],
    ['换手因子',r(hit.t_factor,3)],
    ['价格因子',r(hit.pf,3)],
    ['位置(60日)',hit.pos60==null?'--':(hit.pos60*100).toFixed(0)+'%'],
    ['涨停','<span class="up">今日涨停</span>'],
  ].filter(x=>x[0]!=='涨停'||hit.limit_up);
  el.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">'
   +'<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px"><b style="font-size:17px">'+skName(hit.name,hit.code)+'</b>'
   +'<span style="color:var(--dim)">¥'+r(hit.price,2)+'</span>'
   +'<span class="score" style="font-size:20px">'+r(hit.score_final,1)+'分</span>'
   +(hit.score_final?'':'<span style="color:var(--dim);font-size:12px">无正分 · 相对分 '+r(hit.rel_score,1)+'</span>')
   +'</div><table style="border:none"><tbody>'
   +rows.map(x=>'<tr><td style="border:none;color:var(--dim);width:150px">'+x[0]+'</td><td style="border:none" class="num">'+x[1]+'</td></tr>').join('')
   +'</tbody></table></div>';
}

function marketNote(d){
  /* 说清"现在这份数据是什么状态"：
     休市日打开页面不能让人以为是今天的榜 —— 周末 / 法定假日直接标"今日休市"，
     交易日但还没开盘(数据仍是上一交易日)标"今日未开盘"，其余只在数据过期时补一句日期。 */
  const p=x=>String(x).padStart(2,"0");
  const n=new Date(), t=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`;
  const wd=n.getDay(), hm=n.getHours()*100+n.getMinutes(), q=d.quote_date;
  const closed = wd===0||wd===6||((d.holidays||[]).indexOf(t)>=0);
  if(closed) return q?`　·　今日休市，数据截至 ${q}`:"　·　今日休市";
  if(q&&q!==t) return hm>=935?`　·　数据截至 ${q}`:`　·　今日未开盘，数据截至 ${q}`;
  return "";
}

function render(d){
  if((!d.scores||!d.scores.length)&&!(d.leaderboard&&d.leaderboard.length)&&!(d.fallback&&d.fallback.length)){
    console.log("忽略空数据(接口额度恢复前保留快照)");return;
  }
  buildNameMap(d);
  window.DATA=d;
  document.getElementById("upd").textContent=d.updated_at+(d.intraday?"（盘中）":"（收盘）")+marketNote(d);
  renderLB(document.getElementById("lb_rows"),d.leaderboard,d.fallback);
  renderConcepts(document.getElementById("cpt_rows"),d.concept_stats_heat||[],d.concept_stats||[]);
}
render(EMBEDDED);
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{render(d)}).catch(()=>{});
setInterval(()=>{fetch("data.json?t="+Date.now()).then(r=>r.json()).then(render).catch(()=>{})},60000);
</script>
