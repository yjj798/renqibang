// ---------- 个股链接（口径：E:\AI 长期记忆 2026-10-27「归因页股票代码/名称已加链接」）----------
// 代码 → https://stockpage.10jqka.com.cn/{6位}      名称 → https://xuangutong.com.cn/stock/{6位}.{SUF}
// SUF 取数据自带的交易所后缀（数据里已有 .SH/.SZ/.BJ 就直接用）；没有后缀才走前缀规则
// 前缀规则：6/9→SH 先判、4/8/92→BJ、其余 SZ（92 分支实际不可达，为对齐原页口径原样保留）
function _suf(code){
  const s=String(code||"");
  if(s.indexOf(".")>0) return s.split(".")[1].toUpperCase();
  const c=s.padStart(6,"0"), h=c.charAt(0);
  if(h==="6"||h==="9") return "SH";
  if(c.slice(0,2)==="92") return "BJ";
  if(h==="4"||h==="8") return "BJ";
  return "SZ";
}
function skName(name,code){
  if(!name) return "";
  const raw=String(code||"").split(".")[0];
  if(!raw) return name;                                   // 拿不到代码就保持纯文本，不编链接
  const c=raw.padStart(6,"0");                             // 必须 6 位补零，短码会被同花顺解析成港股 F10
  return '<a class="sk" target="_blank" rel="noopener" href="https://xuangutong.com.cn/stock/'+c+'.'+_suf(code)+'">'+name+'</a>';
}
function buildNameMap(d){
  const m={};
  const put=arr=>{(arr||[]).forEach(s=>{ if(s&&s.name&&s.code) m[s.name]=s.code; });};
  put(d.scores); put(d.leaderboard); put(d.fallback);
  Object.keys(d.lists_raw||{}).forEach(k=>put(d.lists_raw[k]));
  Object.keys(d.lists||{}).forEach(k=>put(d.lists[k]));
  window.NAME2CODE=m;
}
function skByName(name){ return skName(name,(window.NAME2CODE||{})[name]); }

  const rows=(heat||[]).map(g=>{
    const a=attnMap[g.concept];
    const dd=v=>v==null?'<span class="dim">--</span>':(v>0?`<span class="up">+${v}</span>`:(v<0?`<span class="down">${v}</span>`:'0'));
    const arr=(g.traj||[]).map(t=>t.net>0?'<span class="up">↑</span>':(t.net<0?'<span class="down">↓</span>':'<span class="dim">→</span>')).join('')||'<span class="dim">今日建档</span>';
    const net=g.net>0?`<span class="up">+${g.net}</span>`:(g.net<0?`<span class="down">${g.net}</span>`:'0');
    const tk=g.takeover?'<span class="tk">🔥接棒候选</span> ':'';
    return `<tr><td><b>${g.concept}</b>${tk}</td>
      <td class="num">${g.n}</td><td class="num dim">${g.prev_n??'--'}</td><td class="num">${dd(g.delta)}</td>
      <td class="num">${a?a.n:'--'}</td><td class="num dim">${a&&a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${a?dd(a.delta):'--'}</td>
      <td class="num"><span class="up">${g.strong}</span>/<span class="down">${g.weak}</span></td>
      <td class="num">${net}</td><td class="num">${g.limit_up??0}${g.lu_delta?'<span class="'+(g.lu_delta>0?'up':'down')+'">('+(g.lu_delta>0?'+':'')+g.lu_delta+')</span>':''}</td><td class="num ${g.mom>=0?'up':'down'}">${g.mom??'--'}</td><td class="num">${g.ci??'--'}</td><td>${arr}</td><td class="lead">${skByName(g.leader)}</td></tr>`;
  });
  (attn||[]).forEach(a=>{ if(!(heat||[]).some(g=>g.concept===a.concept)){
    const dd=v=>v==null?'<span class="dim">--</span>':(v>0?`<span class="up">+${v}</span>`:(v<0?`<span class="down">${v}</span>`:'0'));
    rows.push(`<tr><td><b>${a.concept}</b></td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td>
      <td class="num">${a.n}</td><td class="num dim">${a.prev_n!=null?a.prev_n:'--'}</td><td class="num">${dd(a.delta)}</td>
      <td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="dim">--</td><td class="lead">${skByName(a.leader)}</td></tr>`);
  }});
  el.innerHTML=rows.join('')||'<tr><td colspan="14" class="dim">暂无集群概念</td></tr>';
}

function renderLB(el,L,fb){
  const row=(s,dimmed,i,first)=>{
    const concept=(s.concept?`<span class="cpt">${s.concept}</span> <span class="${s.is_leader?'lead':'follow'}">${s.is_leader?'龙头':'概念内第'+(s.concept_pos||'?')+'位'}</span>`:'<span class="dim">--</span>')
      +(s.reason?`<br><span class="cpt">📰上涨逻辑:${s.reason}</span>`:'')
      +(s.limit_up?'<br><span style="color:var(--up)">🔴涨停难买</span>':'');
    const turn=(s.turnover_ratio==null?'<span class="dim">--</span>':`<span class="num ${s.turnover_ratio>=0?'up':'down'}">${s.turnover_ratio>=0?'+':''}${s.turnover_ratio}%</span>`)
      +(s.swap_down?'<br><span class="down">⚠️向下换手</span>':'')
      +(s.launch?`<br><span class="cpt">🚀${s.launch}</span>`:'');
    return `<tr${first?' class="r1"':''}${dimmed?' style="opacity:.55"':''}><td class="dim num">${i+1}</td>
     <td><b>${skName(s.name,s.code)}</b></td>
     <td class="score num"${dimmed?' style="color:var(--dim)"':''}>${s.score_final??s.composite??'--'}</td>
     <td class="num">${s.heat_rank?('第'+s.heat_rank+'名'):'--'}</td>
     <td>${pct(s.heat_growth)}</td>
     <td>${concept}</td><td>${turn}</td>
     <td class="dim num">${s.price!=null?"¥"+s.price.toFixed(2):'--'}</td></tr>`;
  };
  if(!L||!L.length){
    if(fb&&fb.length){
      el.innerHTML='<tr><td colspan="8" class="empty" style="padding:10px">今日暂无正分标的（全市场热度较5日均值回落）。<br>以下为<b>相对分参考榜</b>，按热度回落最小排序，仅供观察：</td></tr>'
        +fb.map((s,i)=>row(s,true,i,false)).join('');
    }else{
      el.innerHTML='<tr><td colspan="8" class="empty">今日暂无正分标的：全市场热度较5日均值回落。收盘后自动重算。</td></tr>';
    }
    return;
  }
  el.innerHTML=L.map((s,i)=>row(s,false,i,i===0)).join("");
}

function doSearch(){
  const q=(document.getElementById("q").value||"").trim();
  const el=document.getElementById("sr");
  if(!q){el.innerHTML="";return}
  const hit=(window.DATA&&DATA.scores||[]).find(s=>s.name===q||s.name.indexOf(q)>=0||q.indexOf(s.name)>=0);
  if(!hit){el.innerHTML='<div class="empty" style="border:1px solid var(--border);border-radius:10px;margin-bottom:14px">未找到「'+q+'」的评分记录（仅覆盖热度/关注度前100股票池，接口恢复后自动扩充）</div>';return}
  const r=(v,fix)=>v==null?'--':(fix!=null?Number(v).toFixed(fix):v);
  const rows=[
    ['人气排名(全市场)','第'+r(hit.heat_rank)+'名',hit.heat_rank<=100?'排名进入前100，具备资金关注基础':'排名靠后，市场关注度有限'],
    ['热度增长(vs 5日均)',r(hit.heat_growth)+'%',hit.heat_growth>0?'热度正在放量(动量分M>0)':'热度在退潮，动量为负'],
    ['动量分 M',r(hit.M,3),hit.M>0?'增长越接近+100%分越高；≤0计0分':'负增长：当日热度不及5日均值'],
    ['水平分 L(含上升空间)',r(hit.L,3),'排名越靠前分越高；但前15名内剩余上涨空间打折'],
    ['概念','<span class="cpt">'+(hit.concept||'游离主线')+'</span>'+(hit.is_leader?' <b class="lead">龙头</b>':(hit.concept_pos?' 概念内第'+hit.concept_pos+'位':'')),'主线概念且前排加分；杂毛(概念内后排)系数0.68'],
    ['概念系数',r(hit.concept_factor,3),'龙头1.0 / 前排0.9 / 杂毛0.68 × 集群规模因子'],
    ['换手启动','<span class="cpt">'+(hit.launch||'--')+'</span>'+(hit.swap_down?' <span class="down">⚠️向下换手</span>':''),'低位启动+7%/首启放量+8%/均线粘合+5%；向下换手=高位派发警示'],
    ['换手因子',r(hit.t_factor,3),'换手率较5日均越高且向上，分越高；涨停按1.0'],
    ['价格因子',r(hit.pf,3),''],
    ['🔴涨停难买','',(hit.limit_up?'今日涨停，一字/秒板可能买不进(只标注不降分)':'')],
  ];
  el.innerHTML='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px">'
   +'<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px"><b style="font-size:17px">'+skName(hit.name,hit.code)+'</b>'
   +'<span style="color:var(--dim)">¥'+r(hit.price,2)+'</span>'
   +'<span class="score" style="font-size:20px">'+r(hit.score_final,1)+'分</span>'
   +(hit.score_final?'':'<span style="color:var(--dim);font-size:12px">无正分 · 相对分 '+r(hit.rel_score,1)+'</span>')
   +'</div><table style="border:none"><tbody>'
   +rows.filter(x=>x[0]!=='🔴涨停难买'||x[2]).map(x=>'<tr><td style="border:none;color:var(--dim);width:130px">'+x[0]+'</td><td style="border:none" class="num">'+x[1]+'</td><td style="border:none;color:var(--dim);font-size:11px">'+x[2]+'</td></tr>').join('')
   +'</tbody></table><div style="color:var(--dim);font-size:11px;margin-top:8px">综合分 = 100×√(L×M)×概念系数×换手因子；最终分 = 综合分×价格因子。负增长日综合分为0属正常退潮信号，看相对分排序。</div></div>';
}

function renderBS(el,bs){
  if(!bs||!bs.length){el.innerHTML='<tr><td colspan="4" class="dim">--</td></tr>';return}
  el.innerHTML=bs.map(b=>`<tr><td><b>${b.name}</b></td>
    <td class="num ${b.inc>=0?'up':'down'}">${b.inc>=0?'+':''}${(b.inc||0).toFixed(2)}%</td>
    <td class="num">${(b.strength||0).toFixed(0)}</td>
    <td class="num ${b.main_net>=0?'up':'down'}">${((b.main_net||0)/1e8).toFixed(2)}亿</td></tr>`).join('');
}

function render(d){
  if((!d.scores||!d.scores.length)&&!(d.leaderboard&&d.leaderboard.length)&&!(d.fallback&&d.fallback.length)){
    console.log("忽略空数据(接口额度恢复前保留快照)");return;
  }
  buildNameMap(d);
  window.DATA=d;
  document.getElementById("upd").textContent=d.updated_at+(d.intraday?"（盘中）":"（收盘）");
  renderLB(document.getElementById("lb_rows"),d.leaderboard,d.fallback);
  renderConcepts(document.getElementById("cpt_rows"),d.concept_stats_heat||[],d.concept_stats||[]);
  renderBS(document.getElementById("bs_rows"),d.board_strength);
}
render(EMBEDDED);
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{render(d)}).catch(()=>{});
setInterval(()=>{fetch("data.json?t="+Date.now()).then(r=>r.json()).then(render).catch(()=>{})},60000);
</script>
</body>
